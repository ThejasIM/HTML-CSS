<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <label for="">First Name</label><br>
        <input type="text" value="User First name"><br>
        <label for="">Second Name</label><br>
        <input type="text" value="User Second name"><br><br>
        <input type="submit">
    </form>
    <br><br>    
    <form action="">
        <label for="">Gender</label>
        <input type="radio" name = "Gender" id="male">
        <label for="male">Male</label>
        <input type="radio" name = "Gender" id="female">
        <label for="female">Female</label>
    </form>
    <br>
    <form action="">
        <label for="">Hobbies</label>
        <input type="checkbox" name = "Hobbies" id="basketball">
        <label for="basketball">Basketball</label>
        <input type="checkbox" name = "Hobbies" id="volleyball">
        <label for="volleyball">Volleyball</label>
        <br><br>
    </form>
    <form action="">
        <label for="">Date of birth</label>
        <input type="date"><br>
        <label for="">date and time</label>
        <input type="datetime-local">
        <br>
    </form>
    <form action="">
        <label for="">Color</label>
        <input type="color" name="" id="">
    </form>
</body>
</html>
